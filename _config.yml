# ----
# Site

title: Backcountry Bricks
url: "https://backcountrybricks.com"
baseurl: ""
google_analytics_key:

# Values for the jekyll-seo-tag gem (https://github.com/jekyll/jekyll-seo-tag)
logo: /siteicon.png
description: Lego minifigure photography from the Colorado backcountry and beyond.
author:
  name:
  email:
  twitter: # twitter username without the @ symbol
social:
  name: Backcountry Bricks
  links:
    - https://instagram.com/backcountry_bricks
    - https://tiktok.com/@backcountry_bricks

# -----
# Build

timezone: Etc/UTC

permalink: pretty

defaults:
  -
    scope:
      path: ""
    values:
      layout: "default"
      text_width: false
      image: /uploads/1.jpg
  -
    scope:
      path: "index.html"
    values:
      text_width: false

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENCE

# -----------
# CloudCannon

_options:
  image:
    width: 2048
    height: 1365
    resize_style: "contain"
    mime_type: "image/jpeg"
    expandable: true
