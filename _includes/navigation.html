<button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu" aria-expanded="false">Menu</button>
<nav id="site-nav">
	<a class="editor-link btn" href="cloudcannon:collections/_data/navigation.yml" class="btn"><strong>&#9998;</strong> Edit navigation</a>
	{% for link in site.data.navigation %}
	{% assign class = "" %}

		{% if link.link == page.url %}
			{% assign class = class | append: " active" %}
		{% endif %}
		<a href="{% include relative-src.html src=link.link %}" class="{{ class }}">{{ link.name }}</a>
	{% endfor %}
</nav>
<script>
	document.getElementById('menu-toggle').addEventListener('click', function() {
		var nav = document.getElementById('site-nav');
		var isOpen = nav.classList.toggle('open');
		this.setAttribute('aria-expanded', isOpen);
	});
</script>
