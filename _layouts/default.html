<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		{% seo %}
		<link href="https://fonts.googleapis.com/css2?family=Rosario:wght@400;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
		<link rel="stylesheet" href="{{ site.baseurl }}/css/screen.css">
		<link rel="apple-touch-icon" href="{{ site.baseurl }}/apple-touch-icon.png">
		<link rel="icon" type="image/png" href="{{ site.baseurl }}/touch-icon.png" sizes="192x192">
		<link rel="icon" type="image/png" href="{{ site.baseurl }}/images/favicon.png">
		{% if jekyll.environment == 'production' and site.google_analytics_key != '' %}
			<script>
				window.ga=window.ga||function(){(ga.q=ga.q||[]).push(arguments)};ga.l=+new Date;
				ga('create', '{{ site.google_analytics_key }}', 'auto');
				ga('send', 'pageview');
			</script>
			<script async src='https://www.google-analytics.com/analytics.js'></script>
		{% endif %}
	</head>
	<body {% if page.text_width %}class="text-width"{% endif %}>
		<div class="wrap">
			<header class="site-header" id="site-header">
				<h1><a href="{{ site.baseurl }}/">Backcountry Bricks</a></h1>
				{% include navigation.html %}
				{% include social-sidebar.html %}
			</header>
			{{ content }}
			<footer>
				  © 2026 Backcountry Bricks
			</footer>
		</div>

		{% include scroll-helpers.html %}

		<script>
			// Block right-click and drag-to-save on all images
			document.addEventListener('contextmenu', function(e) {
				if (e.target.tagName === 'IMG') e.preventDefault();
			});
			document.addEventListener('dragstart', function(e) {
				if (e.target.tagName === 'IMG') e.preventDefault();
			});
		</script>
		<!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "b3b960127cc34a238140efeeeec3f194"}'></script><!-- End Cloudflare Web Analytics -->
	</body>
</html>
